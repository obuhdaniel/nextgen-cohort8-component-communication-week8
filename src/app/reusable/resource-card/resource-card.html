<article class="pillar-card">
  <div [class]="iconClass()" aria-hidden="true">{{ resource().letter }}</div>
  <span class="font-bold">{{ resource().title }}</span>
  <p>{{ resource().text }}</p>
 
  <div class="mt-4">

     <app-button 
    [buttonType]="resource().tone === 'orange' ? 'primary' : 'secondary'" 
    [buttonText]="resource().linkLabel"
    arrowRight="true"
   
    />


  </div>
 
</article>
